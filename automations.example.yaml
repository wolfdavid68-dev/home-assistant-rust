# Exemple d'automatisations. Copie ce fichier en `automations.yaml`, adapte les
# noms d'entités (voir GET /api/states), puis vérifie-le avec :
#   cargo run -p ha-server -- automations check
#
# Syntaxe : la même que Home Assistant (triggers / conditions / actions).

# Allumer le salon quand la porte s'ouvre le soir, puis l'éteindre 10 min après.
- id: salon_au_retour
  alias: Lumière du salon au retour le soir
  triggers:
    - trigger: state
      entity_id: binary_sensor.porte_entree
      to: "on"
  conditions:
    - condition: time
      after: "18:00"
      before: "23:30"
    - condition: state
      entity_id: light.salon
      state: "off"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.salon
      data:
        brightness: 180
    - delay: 10min
    - action: light.turn_off
      target:
        entity_id: light.salon

# Prévenir l'oubli : éteindre la prise café si elle est allumée depuis 2 heures.
- id: cafe_oublie
  triggers:
    - trigger: state
      entity_id: switch.prise_cafe
      to: "on"
      for: 2h
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.prise_cafe

# Allumer le radiateur s'il fait moins de 18,5 °C en semaine.
- id: chauffage_semaine
  alias: Radiateur quand il fait froid
  triggers:
    - trigger: numeric_state
      entity_id: sensor.temperature_salon
      below: 18.5
  conditions:
    - condition: time
      weekday: [lun, mar, mer, jeu, ven]
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.radiateur

# Tout éteindre chaque soir à 23 h 45.
- id: extinction_nuit
  triggers:
    - trigger: time
      at: "23:45"
  actions:
    - action: light.turn_off
      target:
        entity_id: [light.salon, light.cuisine]

# Fermer les volets 30 minutes après le coucher du soleil (il faut la
# position de la maison : HA_LATITUDE et HA_LONGITUDE).
- id: volets_coucher_soleil
  alias: Volets fermés à la tombée de la nuit
  triggers:
    - trigger: sun
      event: sunset
      offset: "00:30:00"
  actions:
    - action: cover.close_cover
      target:
        entity_id: cover.volet_salon

# Notifications sur le téléphone (il faut configurer ntfy : HA_NTFY_URL et
# HA_NTFY_TOPIC, voir docs/notifications.md).

# Fumée détectée : notification urgente.
- id: alerte_fumee
  alias: Alerte fumée
  triggers:
    - trigger: state
      entity_id: binary_sensor.fumee_salon
      to: "on"
  actions:
    - action: notify.send_message
      target:
        entity_id: notify.telephone
      data:
        title: Fumée !
        message: Le détecteur de fumée du salon s'est déclenché.
        priority: 5

# Un appareil inconnu vient de rejoindre le Wi-Fi (intégration Freebox).
- id: alerte_nouvel_appareil
  alias: Nouvel appareil sur le Wi-Fi
  triggers:
    - trigger: state
      entity_id: sensor.freebox_nouvel_appareil
  actions:
    - action: notify.send_message
      target:
        entity_id: notify.telephone
      data:
        title: Nouvel appareil sur le Wi-Fi
        message: Un appareil inconnu s'est connecté. Regarde le journal d'activité.
        priority: 4

# Internet coupé depuis 5 minutes.
- id: alerte_internet
  alias: Internet coupé
  triggers:
    - trigger: state
      entity_id: binary_sensor.freebox_internet
      to: "off"
      for: 5min
  actions:
    - action: notify.send_message
      target:
        entity_id: notify.telephone
      data:
        title: Internet coupé
        message: La connexion Internet de la maison est coupée depuis 5 minutes.

# Météo (il faut HA_METEO=on, voir docs/meteo.md) : fermer les volets du
# salon quand il fait plus de 30 °C dehors, en journée.
- id: volets_chaleur
  alias: Volets fermés quand il fait chaud
  triggers:
    - trigger: numeric_state
      entity_id: sensor.meteo_temperature
      above: 30
  conditions:
    - condition: sun
      after: sunrise
      before: sunset
  actions:
    - action: cover.close_cover
      target:
        entity_id: cover.volet_salon

# Prévenir quand l'orage arrive.
- id: alerte_orage
  alias: Orage
  triggers:
    - trigger: state
      entity_id: weather.maison
      to: lightning-rainy
  actions:
    - action: notify.send_message
      target:
        entity_id: notify.telephone
      data:
        title: Orage
        message: Un orage arrive sur la maison. Pense à rentrer le linge !

# Programmation du chauffage (il faut thermostats.yaml, voir docs/thermostat.md) :
# confort en semaine de 6 h 30 à 22 h 30, éco la nuit.
- id: chauffage_matin
  alias: Chauffage confort le matin
  triggers:
    - trigger: time
      at: "06:30"
  conditions:
    - condition: time
      weekday: [lun, mar, mer, jeu, ven]
  actions:
    - action: climate.set_preset_mode
      target:
        entity_id: climate.salon
      data:
        preset_mode: confort

- id: chauffage_nuit
  alias: Chauffage éco la nuit
  triggers:
    - trigger: time
      at: "22:30"
  actions:
    - action: climate.set_preset_mode
      target:
        entity_id: climate.salon
      data:
        preset_mode: eco

# Automatisations plus riches (voir docs/automatisations-avancees.md) :
# une seule automatisation pour l'arrivée et le départ, grâce aux
# identifiants de déclencheurs et à « choose ».
- id: entree
  alias: Lumière de l'entrée
  mode: restart                  # porte rouverte : on recommence le minuteur
  triggers:
    - trigger: state
      entity_id: binary_sensor.porte_entree
      to: "on"
      id: ouverture
    - trigger: state
      entity_id: device_tracker.telephone_david
      to: not_home
      id: depart
  actions:
    - choose:
        # Ouverture de la porte, quand il fait nuit : lumière 5 minutes.
        - conditions:
            - condition: trigger
              id: ouverture
            - condition: or
              conditions:
                - condition: sun
                  after: sunset
                - condition: sun
                  before: sunrise
          sequence:
            - action: light.turn_on
              target: {entity_id: light.entree}
            - delay: 5min
            - action: light.turn_off
              target: {entity_id: light.entree}
        # Départ : tout éteindre, et chauffage en « absent »… sauf s'il
        # est arrêté. (Porte ouverte en journée : aucune option, rien.)
        - conditions:
            - condition: trigger
              id: depart
          sequence:
            - action: light.turn_off
              target: {entity_id: [light.entree, light.salon]}
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: climate.salon
                      state: "off"
              then:
                - action: climate.set_preset_mode
                  target: {entity_id: climate.salon}
                  data: {preset_mode: absent}

# Personnes et zone Maison (il faut persons.yaml, voir docs/personnes.md) :
# zone.home vaut le nombre de personnes à la maison.
- id: dernier_parti
  alias: Le dernier est parti
  triggers:
    - trigger: state
      entity_id: zone.home
      to: "0"
      for: 5min                  # pas pour un aller-retour à la boîte aux lettres
  actions:
    - action: light.turn_off
      target: {entity_id: [light.salon, light.entree]}
    - action: climate.set_preset_mode
      target: {entity_id: climate.salon}
      data: {preset_mode: absent}

- id: premier_arrive
  alias: Le premier est arrivé
  triggers:
    - trigger: state
      entity_id: zone.home
      from: "0"
  actions:
    - action: climate.set_preset_mode
      target: {entity_id: climate.salon}
      data: {preset_mode: confort}
