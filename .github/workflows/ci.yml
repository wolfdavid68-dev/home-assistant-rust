name: CI

# Mesuré sur les 118 runs du 14 au 16 octobre : 2 447 minutes facturées en
# deux jours et demi, plus que tout le quota mensuel d'un dépôt privé.
#
#   job                     minutes   part
#   clippy et tests Windows   1 282    52 %   (minute Windows comptée double)
#   image Docker                506    21 %
#   clippy et tests Linux       280    11 %
#   deny + msrv + format        355    15 %   (une minute pleine chacun)
#
# Et 42 % de ce total venait des pushes sur `main`, qui revalidaient l'arbre
# que la PR venait de valider. Trois changements :
#
#   1. Sur `main`, plus de CI complète. `pull_request` teste déjà le résultat
#      de la fusion. Un push ne relance ce job que si le lockfile ou la
#      toolchain bougent : c'est ce qui périme le cache Rust, et le cache de
#      `main` est le seul dont toutes les PR héritent.
#   2. Windows et Docker sortent dans leurs propres workflows (windows.yml,
#      docker.yml), déclenchés seulement quand ils ont quelque chose à dire.
#   3. Format, clippy, tests, deny et MSRV tiennent dans un seul job : chaque
#      job est arrondi à la minute supérieure, cinq jobs de 10 à 50 s
#      coûtaient cinq minutes.

on:
  # Une PR en brouillon ne lance rien : une session de travail pousse une
  # dizaine de commits par PR (56 PR en deux jours et demi), et chacun
  # repayait toute la CI alors que seul le dernier verdict compte. La PR
  # s'ouvre en brouillon (voir CLAUDE.md) et la CI part au passage en
  # « prête » (`ready_for_review`), puis à chaque push. Un job sauté ne coûte
  # rien. Même règle dans windows.yml et docker.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
  # Filet contre l'éviction du cache (7 jours sans accès).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Le workflow ne peut que lire le dépôt : rien d'autre.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Les actions tierces sont épinglées sur un commit précis (et non un tag modifiable).
# Dependabot les met à jour.
jobs:
  check:
    name: vérifications (Linux)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup est préinstallé et lit rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install

      # En premier : une seconde, et l'erreur la plus fréquente.
      - name: Format
        run: cargo fmt --all --check

      # Les scripts du mini-PC (packaging/linux) : shellcheck est déjà sur
      # les machines de GitHub.
      - name: Scripts shell
        run: shellcheck packaging/linux/installer.sh packaging/linux/mise-a-jour.sh packaging/linux/ha-maison

      - name: Dépendances (failles, licences, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Tests
        run: cargo test --workspace --all-features --locked

  # Reste à part : une autre version de rustc recompile tout, et elle a besoin
  # de son propre cache. Dans le même job, les deux caches se marcheraient
  # dessus.
  msrv:
    # Vérifie que le projet compile avec la version minimale annoncée dans
    # Cargo.toml (`rust-version`), et pas seulement avec la dernière.
    name: version minimale de Rust
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | cut -d '"' -f2)
          rustup toolchain install "$MSRV" --profile minimal
          echo "MSRV=$MSRV" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        run: cargo +"$MSRV" check --workspace --all-targets --locked
