name: CI

# Le dépôt est public depuis le 19 octobre 2026 : les machines standard de
# GitHub ne sont plus facturées. La CI vérifie donc tout ce qui compte, sans
# économiser les minutes :
#
#   1. Chaque PR prête, et `main` après chaque fusion : `pull_request` teste
#      le résultat de la fusion au moment du push, mais `main` a pu bouger
#      depuis. Ce run garde aussi le cache Rust de `main`, le seul dont toutes
#      les PR héritent.
#   2. Windows et Docker ont leurs propres workflows (windows.yml,
#      docker.yml) : leurs verdicts se lisent à part.
#   3. Format, clippy, tests, deny et MSRV tiennent en deux jobs : un seul
#      cache Rust par version de rustc.

on:
  # Une PR en brouillon ne lance rien : une session de travail pousse une
  # dizaine de commits par PR, et seul le dernier verdict compte (des runs
  # inutiles encombrent l'onglet Actions et retardent les autres). La PR
  # s'ouvre en brouillon (voir CLAUDE.md) et la CI part au passage en
  # « prête » (`ready_for_review`), puis à chaque push. Même règle dans
  # windows.yml et docker.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Filet contre l'éviction du cache (7 jours sans accès).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Le workflow ne peut que lire le dépôt : rien d'autre.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Les actions tierces sont épinglées sur un commit précis (et non un tag modifiable).
# Dependabot les met à jour.
jobs:
  check:
    name: vérifications (Linux)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup est préinstallé et lit rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install

      # En premier : une seconde, et l'erreur la plus fréquente.
      - name: Format
        run: cargo fmt --all --check

      # Les scripts du mini-PC (packaging/linux) : shellcheck est déjà sur
      # les machines de GitHub.
      - name: Scripts shell
        run: shellcheck packaging/linux/installer.sh packaging/linux/tout-compris.sh packaging/linux/mise-a-jour.sh packaging/linux/ha-maison

      - name: Dépendances (failles, licences, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check all

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Tests
        run: cargo test --workspace --all-features --locked

  # Reste à part : une autre version de rustc recompile tout, et elle a besoin
  # de son propre cache. Dans le même job, les deux caches se marcheraient
  # dessus.
  msrv:
    # Vérifie que le projet compile avec la version minimale annoncée dans
    # Cargo.toml (`rust-version`), et pas seulement avec la dernière.
    name: version minimale de Rust
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | cut -d '"' -f2)
          rustup toolchain install "$MSRV" --profile minimal
          echo "MSRV=$MSRV" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        run: cargo +"$MSRV" check --workspace --all-targets --locked
