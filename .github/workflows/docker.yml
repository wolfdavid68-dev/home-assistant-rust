name: Docker

# Ce job vérifie l'emballage : que les fichiers compose sont valides, que
# l'image se construit, tient dans son budget (taille, mémoire, temps de
# réponse), démarre en lecture seule et s'arrête proprement. Il tourne quand
# l'emballage ou le programme change : un changement de code peut faire
# dépasser les 80 Mo, et doit se voir sur la PR, pas après la fusion.
#
# Le filet hebdomadaire rattrape ce que le filtre laisserait passer.

on:
  # Rien sur une PR en brouillon : voir ci.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Dockerfile
      - compose.yaml
      - packaging/linux/compose.yaml
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - rust-toolchain.toml
      - .github/workflows/docker.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    # Construit l'image, la démarre avec les mêmes protections que
    # compose.yaml, puis vérifie qu'elle répond et s'arrête proprement.
    name: image Docker
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sans rien démarrer : la syntaxe, les variables et les volumes. Les
      # deux fichiers n'exigent ni .env ni fichier de secret (tout ce qui en
      # demande est en commentaire).
      - name: Fichiers compose
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f packaging/linux/compose.yaml config -q

      # Le cache de GitHub (type=gha) garde les couches de l'image d'une
      # fois sur l'autre : relancer un run, ou reconstruire un arbre déjà
      # construit, ne recompile rien. Les caches `--mount=type=cache` du
      # Dockerfile, eux, ne survivent pas à la machine : un changement de
      # code recompile le serveur.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ha-server:ci
          provenance: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max,ignore-error=true

      - name: Smoke test
        run: |
          docker run -d --name ha --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:8123:8123 ha-server:ci
          status=starting
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ha)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs ha
          test "$status" = healthy
          curl -fsS -D - -o /dev/null http://127.0.0.1:8123/ | grep -i '^content-security-policy:'

      - name: Budget de performance
        # Étape 47 (docs/performance.md) : une régression fait échouer la PR
        # au lieu de s'installer en silence.
        run: |
          size=$(docker image inspect ha-server:ci --format '{{.Size}}')
          echo "image : $((size / 1024 / 1024)) Mo (budget 80 Mo)"
          test "$size" -le $((80 * 1024 * 1024))
          # Mémoire au repos, après quelques secondes de marche.
          sleep 10
          memory=$(docker stats --no-stream --format '{{.MemUsage}}' ha | cut -d/ -f1 | tr -d ' ')
          echo "mémoire au repos : $memory (budget 64 MiB)"
          mib=$(echo "$memory" | awk '/GiB/ {print $1 * 1024; next} /MiB/ {print $1 + 0; next} /KiB/ {print $1 / 1024; next} {print 9999}')
          awk -v m="$mib" 'BEGIN { exit !(m <= 64) }'
          # Temps de réponse : 95 % des réponses en moins de 25 ms.
          for path in / /api/; do
            p95=$(for _ in $(seq 1 60); do curl -s -o /dev/null -w '%{time_total}\n' "http://127.0.0.1:8123$path"; done \
              | sort -n | awk '{t[NR] = $1} END {print t[int(NR * 0.95)] * 1000}')
            echo "$path : 95 % sous $p95 ms (budget 25 ms)"
            awk -v p="$p95" 'BEGIN { exit !(p <= 25) }'
          done

      - name: Arrêt propre
        run: |
          docker stop ha
          docker logs ha 2>&1 | grep 'SIGTERM'
          test "$(docker inspect --format '{{.State.ExitCode}}' ha)" = 0
