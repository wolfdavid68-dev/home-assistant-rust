name: Windows

# Clippy et les tests sous Windows, là où tourne la maison. Le code propre
# à Windows (`cfg(windows)`) vit dans ha-storage, ha-teleinfo et ha-server,
# que deux PR sur trois touchent : une étiquette à penser à poser laissait
# passer des casses. Le dépôt est public, les machines standard de GitHub ne
# sont plus facturées : la vérification tourne donc
#
#   - sur chaque PR prête (pas en brouillon, voir ci.yml) ;
#   - sur `main` après chaque fusion : ce run garde aussi le cache dont les
#     PR héritent ;
#   - chaque lundi (filet contre l'éviction du cache) et à la main.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: clippy et tests (Windows)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Tests
        run: cargo test --workspace --all-features --locked
