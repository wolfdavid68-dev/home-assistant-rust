[package]
name = "ha-tls"
description = "Connexions HTTPS : certificat épinglé (appareils locaux) ou vérifié (Internet)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jiff.workspace = true
# Le HTTPS de la maison (étape 79) : l'autorité locale et le certificat du
# serveur. `x509-parser` relit l'autorité rangée sur le disque.
rcgen = { workspace = true, features = ["x509-parser"] }
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier = "0.7.1"
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Pour fabriquer des réponses HTTP dans les tests de `read_limited`.
futures-util.workspace = true
http = "1.5.0"
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
