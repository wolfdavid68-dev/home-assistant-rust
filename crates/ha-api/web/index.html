<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f172a">
  <title>Maison</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <!-- Tout le code est dans app.js : la politique de sécurité (CSP) interdit
       le JavaScript écrit directement dans la page. -->
  <script src="/app.js" defer></script>
</head>
<body>
  <!-- Écran de connexion -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand">
        <img src="/icon.svg" alt="" width="48" height="48">
        <h1>Maison</h1>
      </div>
      <label>
        Nom d'utilisateur
        <input name="username" autocomplete="username" required autocapitalize="none" spellcheck="false">
      </label>
      <label>
        Mot de passe
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <label>
        <span>Code de vérification <small>(si la double authentification est activée)</small></span>
        <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7"
               pattern="[0-9 ]{6,7}" placeholder="123 456">
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit" class="primary">Se connecter</button>
    </form>
  </main>

  <!-- Tableau de bord -->
  <div id="dashboard-view" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="/icon.svg" alt="" width="32" height="32">
        <h1>Maison</h1>
      </div>
      <div class="topbar-right">
        <span id="connection" class="status" aria-live="polite">Connexion…</span>
        <button id="logout" class="ghost" type="button">Déconnexion</button>
      </div>
    </header>
    <main id="sections" class="sections" aria-live="polite"></main>
    <p id="empty" class="empty" hidden>
      Aucun appareil pour l'instant. Configure MQTT ou associe ton pont Hue
      (<code>ha-server hue pair</code>).
    </p>
  </div>
</body>
</html>
