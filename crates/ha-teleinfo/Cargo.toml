[package]
name = "ha-teleinfo"
description = "Compteur Linky : lecture de la télé-information client (TIC), modes historique et standard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ha-core = { path = "../ha-core" }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "net", "io-util"] }
tracing.workspace = true

# La liaison série : réglages du terminal (termios) sans `unsafe`.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "net", "io-util", "test-util"] }

[lints]
workspace = true
