[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# Versions des dépendances, définies une seule fois pour tout le workspace.
[workspace.dependencies]
# Mots de passe : Argon2id. Jetons : générateur aléatoire du système + SHA-256.
argon2 = "0.6.0"
getrandom = "0.4.3"
sha2 = "0.11.1"
# Double authentification (TOTP, RFC 6238) : HMAC-SHA1, l'algorithme que
# toutes les applis d'authentification connaissent. QR code affiché dans le terminal.
hmac = "0.13.0"
sha1 = "0.11.0"
qrcode = { version = "0.14.1", default-features = false }
zeroize = "1.9.1"
# Chiffrement des secrets rangés dans la base (jetons Hue et Somfy) :
# XChaCha20-Poly1305, en Rust pur (RustCrypto). L'aléatoire vient de `getrandom`.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
rpassword = "7.5.4"
# Notifications du navigateur (Web Push, RFC 8291 et 8292) : ECDH et ECDSA
# P-256, HKDF, AES-128-GCM. `ring` est déjà là pour le HTTPS (rustls).
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
base64 = "0.22.1"
# Serveur web : HTTP/1 et WebSocket uniquement.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "ws"] }
tower-http = { version = "0.7.1", features = ["set-header", "timeout"] }
# MQTT sans TLS : la partie TLS de rumqttc 0.25 dépend de crates vulnérables
# ou abandonnées (refusées par cargo deny). À réactiver quand ce sera corrigé.
rumqttc = { version = "0.25.1", default-features = false }
# HTTPS vers le pont Hue : rustls récent avec `ring` (pas de compilateur C++
# ni CMake à installer sous Windows), sans les certificats du système puisque
# le certificat du pont est épinglé.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Automatisations : YAML en Rust pur (sans `unsafe-libyaml`, abandonnée) et
# dates/heures locales avec fuseau horaire.
jiff = "0.2.38"
# Lecture et vérification des adresses web (déjà utilisée par reqwest).
url = "2.5.8"
serde-saphyr = "2.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SQLite uniquement : pas de MySQL (qui tire `rsa`, faille connue) ni de PostgreSQL.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false }
# Alexa en local : socket UDP partagée pour la découverte SSDP (port 1900).
socket2 = "0.6.5"
tracing = "0.1.44"
# Compteur Linky sur un module USB : réglage de la liaison série (termios),
# avec une interface sûre. Unix seulement.
nix = { version = "0.31.3", default-features = false, features = ["term", "fs"] }
# Arrêt propre des tâches de fond (`CancellationToken`).
tokio-util = { version = "0.7.20", default-features = false }
# Uniquement pour les tests (sauf futures-util, aussi utilisé par ha-hue).
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
rcgen = "0.14.10"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Règles plus strictes (« pédantes ») : code plus lisible et plus sûr.
pedantic = { level = "warn", priority = -1 }
# … sauf celles qui gênent plus qu'elles n'aident ici :
missing_errors_doc = "allow"  # chaque fonction n'a pas besoin d'une section « # Errors »
doc_markdown = "allow"        # se trompe sur les mots français et les noms de marques
too_many_lines = "allow"      # une fonction longue mais linéaire reste lisible
# Pas de panique sur des données externes : on gère les erreurs avec Result.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Argon2 est volontairement coûteux : sans optimisation (mode debug), une
# connexion prendrait plusieurs secondes pendant le développement et les tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
