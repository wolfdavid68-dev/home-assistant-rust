[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Versions des dépendances, définies une seule fois pour tout le workspace.
[workspace.dependencies]
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Pas de panique sur des données externes : on gère les erreurs avec Result.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
