# Configuration de cargo-deny : https://embarkstudios.github.io/cargo-deny/
# La CI échoue si une dépendance a une faille connue, une licence non autorisée
# ou vient d'une source inconnue.

[graph]
all-features = true

[advisories]
# Failles connues (base RustSec) : toujours bloquantes.
# Crates non maintenues ou retirées : bloquantes aussi pour nos dépendances directes et indirectes.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Licences permissives uniquement.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Nos propres crates ne sont pas publiées.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Uniquement crates.io : pas de dépendances tirées d'un dépôt Git arbitraire.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
