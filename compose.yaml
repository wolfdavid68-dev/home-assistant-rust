# Lancement avec Docker Compose. Guide complet : docs/etape-7-deploiement.md
#
#   docker compose up -d --build                     démarrer (et construire)
#   docker compose run --rm ha-server user add <nom> créer un compte
#   docker compose logs -f                           voir les logs
#   docker compose down                              arrêter
#   docker compose run --rm sauvegarde …             sauvegarder (voir le guide)
#
# Les données (base ha.db : comptes, historique, associations Hue et Somfy)
# sont dans le volume « ha-data », et la clé qui chiffre les jetons dans
# « ha-cle ». Les deux sont conservés entre les mises à jour.

services:
  ha-server:
    build: .
    image: ha-server:local
    restart: unless-stopped
    ports:
      # Par défaut, le tableau de bord n'est joignable QUE depuis cette
      # machine (127.0.0.1). Pour l'ouvrir à ton réseau local, mets par
      # exemple HA_PUBLISH=192.168.1.20 (l'adresse de cette machine) dans un
      # fichier .env à côté de ce fichier. Ne redirige JAMAIS ce port depuis
      # ta box Internet : pour l'accès à distance, voir le guide (VPN).
      - "${HA_PUBLISH:-127.0.0.1}:8123:8123"
      # Enceintes Sonos (voir docs/sonos.md) : elles viennent chercher les
      # annonces sur ce port, qui ne sert que les annonces en cours.
      # - "8124:8124"
    environment:
      TZ: ${TZ:-Europe/Paris}
      RUST_LOG: ${RUST_LOG:-info}
      # HTTPS sur le réseau de la maison (voir docs/https-maison.md) : l'adresse
      # de cette machine dans HA_TLS_NOMS (le conteneur ne la voit pas).
      # HA_TLS: "on"
      # HA_TLS_NOMS: 192.168.1.20
      # Éditeur d'automatisations en lecture seule (voir docs/editeur-automatisations.md) :
      # HA_AUTOMATION_EDITOR: "off"
      # Notifications sur le téléphone avec ntfy (voir docs/notifications.md) :
      # HA_NTFY_URL: https://ntfy.sh
      # HA_NTFY_TOPIC: maison-un-sujet-long-et-aleatoire
      # HA_NTFY_TOKEN_FILE: /run/secrets/ntfy_token
      # Position de la maison, pour le soleil (deux décimales suffisent) :
      # Sauvegardes automatiques (déjà actives dans l'image) : heure et nombre gardé.
      # HA_BACKUP_TIME: "03:30"
      # HA_BACKUP_KEEP: "7"
      # HA_LATITUDE: "48.85"
      # HA_LONGITUDE: "2.35"
      # Météo locale avec Open-Meteo (voir docs/meteo.md), il faut la position :
      # HA_METEO: "on"
      # Alexa en local (voir docs/alexa.md). Linux : avec « network_mode:
      # host » plus bas ; Windows, macOS : avec le relais (plus bas aussi).
      # Adresse de cette machine, et adresses de tes Echo :
      # HA_ALEXA_IP: 192.168.1.20
      # HA_ALEXA_ALLOWED: 192.168.1.40,192.168.1.41
      # Vigilance Météo-France (voir docs/vigilance.md) : ton département, et la
      # clé de l'API dans secrets/meteofrance.txt (avec « secrets » plus bas) :
      # HA_VIGILANCE_DEPARTEMENT: "67"
      # HA_VIGILANCE_KEY_FILE: /run/secrets/meteofrance
      # Broker MQTT (étape 4), facultatif :
      # HA_MQTT_HOST: 192.168.1.20
      # HA_MQTT_USER: ha-server
      # HA_MQTT_PASSWORD_FILE: /run/secrets/mqtt_password
      # Enceintes Sonos et annonces vocales (voir docs/sonos.md) : l'adresse
      # d'une enceinte, celle de cette machine, et la voix (service « piper »
      # plus bas, et le port 8124 plus haut) :
      # HA_SONOS: 192.168.1.30
      # HA_SONOS_AUDIO: 192.168.1.20
      # HA_PIPER: tcp://piper:10200
      # Parler à la maison depuis la tablette (voir docs/voix.md) : la voix
      # ci-dessus (HA_PIPER et le service « piper ») et l'écoute (service
      # « ecoute » plus bas, avec « networks » ci-dessous) :
      # HA_ECOUTE: ws://ecoute:10350
      # Le mot d'appel des tablettes (voir docs/mot-appel.md), « Maison » si
      # rien n'est dit :
      # HA_MOT_APPEL: Maison
      # Compteur Linky (voir docs/energie.md) : module USB (avec « devices »
      # et « group_add » plus bas), ou module réseau :
      # HA_TELEINFO: /dev/ttyUSB0
      # HA_TELEINFO: tcp://192.168.1.50:3333
    # L'écoute (service « ecoute » plus bas) : ha-server rejoint aussi son
    # réseau interne.
    # networks:
    #   - default
    #   - ecoute
    volumes:
      - ha-data:/data
      # La clé qui chiffre les jetons Hue et Somfy, à part de la base.
      - ha-cle:/cle
      # Sauvegardes automatiques de chaque nuit (voir docs/sauvegardes.md).
      - ha-sauvegardes:/sauvegardes
      # Tes fichiers d'automatisations et de pièces : config/automations.yaml et
      # config/areas.yaml (lecture seule).
      - ./config:/config:ro
    # secrets:
    #   - mqtt_password
    #   - meteofrance
    # Alexa : la découverte (multicast) exige le réseau de la machine. La
    # ligne « ports » ci-dessus ne sert alors plus : mets HA_BIND sur
    # l'adresse voulue (voir docs/alexa.md).
    # network_mode: host
    # Docker Desktop (Windows, macOS) : pas de réseau de la machine. Garde ce
    # réseau, ajoute HA_ALEXA_LISTEN: 0.0.0.0:8080 et le port
    # "127.0.0.1:8127:8080", puis lance le relais sur la machine
    # (« ha-server alexa relay », voir docs/alexa.md).
    # Compteur Linky sur un module USB : le conteneur ne voit que ce port, et
    # le groupe du port lui donne le droit de le lire. Ce groupe est un
    # numéro : celui que donne « ls -ln /dev/ttyUSB0 » (souvent 20, dialout).
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    # group_add:
    #   - "20"

    # Durcissement : le programme n'a besoin d'aucun privilège.
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    # Laisse le temps d'enregistrer les derniers états à l'arrêt.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # La voix des annonces et des réponses à la tablette (Piper, voir
  # docs/sonos.md) : enlève les « # » de ce service et de « piper-voix » plus
  # bas. Il télécharge la voix une seule fois ; ensuite, tout reste sur cette
  # machine. Pas de port publié : seul ha-server lui parle.
  # piper:
  #   image: rhasspy/wyoming-piper:2.5.2@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
  #   command: --voice fr_FR-siwis-medium
  #   restart: unless-stopped
  #   volumes:
  #     - piper-voix:/data
  #   mem_limit: 512m

  # L'écoute de la tablette (Parakeet, voir docs/voix.md) : enlève les « # »
  # de ce service, du réseau « ecoute » tout en bas, et mets HA_ECOUTE et
  # « networks » dans ha-server. Construite sur cette machine (670 Mo
  # téléchargés une fois, chaque fichier vérifié par son empreinte), avec
  # « docker compose build ecoute ». Elle vit dans un réseau interne à elle,
  # que seul ha-server rejoint : aucun port publié, pas d'accès à Internet.
  # Pas avec « network_mode: host » (Alexa) : ha-server ne la joindrait pas.
  # ecoute:
  #   build: ./packaging/docker/ecoute
  #   image: ha-maison-ecoute:local
  #   restart: unless-stopped
  #   networks:
  #     - ecoute
  #   user: "65532:65532"
  #   read_only: true
  #   cap_drop:
  #     - ALL
  #   security_opt:
  #     - no-new-privileges:true
  #   mem_limit: 1500m
  #   cpus: 4
  #   pids_limit: 64

  # Outil de sauvegarde et de restauration de la base, lancé seulement à la
  # demande (voir le guide). Il ne démarre jamais avec « docker compose up ».
  sauvegarde:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    profiles: [outils]
    network_mode: none
    volumes:
      - ha-data:/data
      - ha-cle:/cle
      - ha-sauvegardes:/automatiques
      - ./sauvegardes:/sauvegardes

volumes:
  ha-data:
  ha-cle:
  ha-sauvegardes:
  # piper-voix:

# secrets:
#   mqtt_password:
#     file: ./secrets/mqtt_password
#   meteofrance:
#     file: ./secrets/meteofrance.txt

# Le réseau de l'écoute (voir le service « ecoute ») : interne, sans Internet.
# networks:
#   ecoute:
#     internal: true
